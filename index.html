<style>
  :root{
    --paper:#000000;
    --ink:#ebece9;
    --soft:#9a9a92;
    --hair:rgba(235,236,233,.16);
    --spot:#ff2a17;
    --pad:clamp(16px,3.2vmin,34px);
  }
  /* Light mode. The paper is the same off-white the portrait is drawn on, so the
     portrait's panel merges into the page and the blue face appears to float. That
     also means the 45 degree corner notches stop reading in light mode -- deliberate.
     The spot red is darkened here: #ff2a17 manages only 3.2:1 against off-white,
     which is marginal for a focus ring, where #d81f0e reaches 4.3:1. */
  :root[data-theme="light"]{
    --paper:#ebece9;
    --ink:#000000;
    --soft:#4f4f48;
    --hair:rgba(0,0,0,.16);
    --spot:#d81f0e;
  }
  /* "System" follows the OS. The second selector is the no-JavaScript case, where
     data-theme is never set on <html> at all. */
  @media (prefers-color-scheme:light){
    :root[data-theme="system"],:root:not([data-theme]){
      --paper:#ebece9;
      --ink:#000000;
      --soft:#4f4f48;
      --hair:rgba(0,0,0,.16);
      --spot:#d81f0e;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"JetBrains Mono",ui-monospace,monospace;
    height:100svh;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    transition:background-color .28s ease,color .28s ease;
  }
  a{color:inherit;text-decoration:none}
  ::selection{background:var(--ink);color:var(--paper)}

  /* ---- proof sheet shell ---- */
  .sheet{
    position:relative;
    height:100svh;
    padding:var(--pad);
    display:flex;
    flex-direction:column;
  }
  .frame{
    position:absolute;
    inset:calc(var(--pad) * .62);
    pointer-events:none;
  }
  /* crop marks at the four corners */
  .crop{position:absolute;width:14px;height:14px;pointer-events:none}
  .crop::before,.crop::after{content:"";position:absolute;background:var(--ink)}
  .crop::before{width:14px;height:1px;top:0;left:0}
  .crop::after{width:1px;height:14px;top:0;left:0}
  .crop.tl{top:calc(var(--pad) * .28);left:calc(var(--pad) * .28)}
  .crop.tr{top:calc(var(--pad) * .28);right:calc(var(--pad) * .28);transform:scaleX(-1)}
  .crop.bl{bottom:calc(var(--pad) * .28);left:calc(var(--pad) * .28);transform:scaleY(-1)}
  .crop.br{bottom:calc(var(--pad) * .28);right:calc(var(--pad) * .28);transform:scale(-1)}

  /* ---- top bar ---- */
  .topbar{
    flex:0 0 auto;
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    font-size:clamp(.58rem,1.45vmin,.72rem);
    letter-spacing:.16em;text-transform:uppercase;color:var(--soft);
  }
  .reg{display:inline-flex;align-items:center;gap:.6em}
  .reg svg{width:13px;height:13px;display:block}
  .reg b{color:var(--soft);font-weight:400;letter-spacing:.14em}
  .coords{text-align:right;line-height:1.5;white-space:nowrap}
  /* On narrow phones keep the coordinates but shrink them a touch so neither bar crowds or wraps. */
  @media (max-width:560px){ .coords{font-size:.56rem;letter-spacing:.08em} }

  /* ---- theme switch ---- */
  /* Alone in the bottom-right corner, the mark that corner carries. Deliberately
     faint: it rests at 45% opacity and only comes up to full on hover or keyboard
     focus, so it reads as a utility rather than shouting from the corner. */
  .theme{
    display:inline-flex;align-items:center;gap:2px;
    border:1px solid var(--hair);padding:1px;
    opacity:.45;
    transition:opacity .22s ease;
  }
  .theme:focus-within{opacity:1}
  @media (hover:hover) and (pointer:fine){ .theme:hover{opacity:1} }
  .theme button{
    appearance:none;-webkit-appearance:none;
    background:none;border:0;margin:0;padding:0;
    width:22px;height:18px;
    display:grid;place-items:center;
    color:var(--soft);cursor:pointer;
    transition:background-color .18s,color .18s;
  }
  .theme svg{width:11px;height:11px;display:block}
  /* Selected state is a faint wash plus full-strength ink, rather than the hard
     inverted block it used before -- quieter, still unambiguous. */
  .theme button[aria-checked="true"]{background:var(--hair);color:var(--ink)}
  .theme button:focus-visible{outline:2px solid var(--spot);outline-offset:2px}
  @media (hover:hover) and (pointer:fine){
    .theme button:not([aria-checked="true"]):hover{color:var(--ink)}
  }

  /* ---- main ---- */
  .main{
    flex:1 1 auto;min-height:0;
    display:grid;
    grid-template-columns:1fr;
    align-content:center;
    /* Stacked layout only -- the wide and short-landscape rules below set their own gap,
       where this is the horizontal space between the two columns instead. Widened on
       2026-08-15 from clamp(18px,3vmin,34px): at 18px the portrait sat closer to the name
       than the name sits to the spec sheet, which reads as the picture crowding it. */
    gap:clamp(34px,5.4vmin,46px);
    padding:clamp(8px,2vmin,22px) 0;
  }
  .portrait{
    align-self:center;justify-self:start;
    background:var(--paper);
    max-height:min(16svh,118px);
    width:auto;display:block;
    /* Aesthetic flourish: clip small right-triangles off the top-left
       and bottom-right corners. */
    clip-path:polygon(
      12px 0, 100% 0,
      100% calc(100% - 12px), calc(100% - 12px) 100%,
      0 100%, 0 12px
    );
  }
  /* The only gap this sets is the one between the name and the spec sheet -- they are
     the block's only two children. Widened on 2026-08-14 at Marco's request, from
     clamp(14px,2.6vmin,24px), roughly doubling the breathing room at every size. */
  /* Only once the script has made it interactive -- a no-JS visitor gets a plain image. */
  .portrait[role="button"]{cursor:pointer}
  .portrait:focus-visible{outline:2px solid var(--spot);outline-offset:4px}

  .ident{display:flex;flex-direction:column;gap:clamp(36px,6.6vmin,64px);min-width:0}

  h1.name{
    font-family:"Tomorrow",sans-serif;
    font-optical-sizing:auto;
    font-weight:600;
    text-transform:uppercase;
    line-height:.82;
    letter-spacing:-.022em;
    font-size:clamp(2.5rem,13vmin,7rem);
    margin-block:-.03em;
  }
  h1.name span{display:block}
  h1.name .r2{margin-left:0}

  /* ---- spec table ---- */
  .spec{
    display:grid;
    grid-template-columns:auto 1fr;
    column-gap:clamp(14px,2.6vmin,30px);
    row-gap:clamp(11px,2.3vmin,19px);
    font-size:clamp(.8rem,2vmin,1rem);
    line-height:1.35;
    max-width:46ch;
    /* Baseline-align each label to the FIRST line of its value, so a value
       that wraps to two lines doesn't drag the label down to the last line. */
    align-items:baseline;
  }
  .spec dt{
    color:var(--soft);text-transform:uppercase;letter-spacing:.13em;
    font-size:.78em;white-space:nowrap;
  }
  .spec dd{color:var(--ink);line-height:1.7}
  .spec dd .sep{color:var(--hair);margin:0 .35em}

  /* invert-on-hover link */
  .lk{
    position:relative;display:inline;white-space:nowrap;
    color:var(--ink);
    box-decoration-break:clone;-webkit-box-decoration-break:clone;
    padding:.04em .2em;margin:0 -.2em;
    background-image:linear-gradient(var(--ink),var(--ink));
    background-size:100% 0%;background-position:0 100%;background-repeat:no-repeat;
    transition:background-size .22s cubic-bezier(.2,.7,.2,1),color .22s;
  }
  .lk .arw{font-size:.78em;vertical-align:.06em;opacity:.55}
  /* Invert-on-hover only where a real pointer exists, so taps on touch screens
     don't leave the link "stuck" highlighted after returning to the page.
     Keyboard focus keeps the effect for accessibility. */
  @media (hover:hover) and (pointer:fine){
    .lk:hover{color:var(--paper);background-size:100% 100%}
    .lk:hover .arw{opacity:.8}
  }
  .lk:focus-visible{color:var(--paper);background-size:100% 100%}
  .lk:focus-visible .arw{opacity:.8}
  a:focus-visible{outline:2px solid var(--spot);outline-offset:3px;border-radius:1px}

  /* ---- footer ---- */
  .foot{
    flex:0 0 auto;
    /* Two marks only: the barcode on the left, the theme switch on the right. There is
       no longer any text down here, so the old baseline alignment has nothing to align
       to -- the barcode and the switch are centred against each other instead. */
    display:flex;justify-content:space-between;align-items:center;gap:16px;
    font-size:clamp(.58rem,1.45vmin,.72rem);
    letter-spacing:.14em;text-transform:uppercase;color:var(--soft);
  }
  .foot .dom{color:var(--soft);font-family:"Libre Barcode 128",system-ui,monospace;font-size:2em;letter-spacing:normal;line-height:1;text-align:left}

  /* ====== WIDE / LANDSCAPE: two columns ====== */
  @media (min-width:880px) and (min-height:480px){
    .main{
      grid-template-columns:auto auto;
      grid-template-areas:"portrait ident";
      justify-content:center;
      align-items:center;
      gap:clamp(30px,3.6vw,58px);
      padding:0;
    }
    .portrait{grid-area:portrait;max-height:min(32svh,205px);align-self:center}
    .ident{grid-area:ident}
    h1.name{font-size:clamp(3.2rem,8.4vmin,6.6rem)}
  }
  /* short landscape phones */
  @media (max-height:480px) and (orientation:landscape){
    .main{grid-template-columns:auto auto;justify-content:center;gap:clamp(20px,4vw,40px);align-items:center}
    .portrait{max-height:min(45svh,138px)}
    h1.name{font-size:clamp(2rem,8vh,3.4rem)}
    .topbar,.foot{font-size:.56rem}
  }

  /* reduced motion handled (no entrance animation by default for safety) */
  .reveal{opacity:0;transform:translateY(8px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
  .reveal.d1{animation-delay:.05s}
  .reveal.d2{animation-delay:.13s}
  .reveal.d3{animation-delay:.2s}
  .reveal.d4{animation-delay:.27s}
  .portrait.reveal{transform:none;animation:fade .9s ease forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){
    .reveal{animation:none;opacity:1;transform:none}
    body,.theme button{transition:none}
  }
</style>
</head>

<script>
(function(){
  var KEY="mr-theme",
      root=document.documentElement,
      group=document.getElementById("theme"),
      meta=document.getElementById("theme-color");
  if(!group) return;
  var btns=[].slice.call(group.querySelectorAll("button[data-mode]")),
      mq=window.matchMedia("(prefers-color-scheme: light)");

  function apply(mode){
    root.setAttribute("data-theme",mode);
    btns.forEach(function(b){
      var on=b.getAttribute("data-mode")===mode;
      b.setAttribute("aria-checked",on?"true":"false");
      b.tabIndex=on?0:-1;                      /* roving tabindex: one stop for the group */
    });
    var light=mode==="light"||(mode==="system"&&mq.matches);
    if(meta) meta.setAttribute("content",light?"#ebece9":"#000000");
  }
  function choose(mode,moveFocus){
    try{localStorage.setItem(KEY,mode)}catch(e){}
    apply(mode);
    if(moveFocus){var b=group.querySelector('[data-mode="'+mode+'"]');if(b)b.focus()}
  }
  btns.forEach(function(b,i){
    b.addEventListener("click",function(){choose(b.getAttribute("data-mode"),false)});
    b.addEventListener("keydown",function(e){
      var d=(e.key==="ArrowRight"||e.key==="ArrowDown")?1:(e.key==="ArrowLeft"||e.key==="ArrowUp")?-1:0;
      if(!d) return;
      e.preventDefault();
      choose(btns[(i+d+btns.length)%btns.length].getAttribute("data-mode"),true);
    });
  });
  /* Keep "system" honest if the OS flips while the page is open. */
  var onChange=function(){if(root.getAttribute("data-theme")==="system") apply("system")};
  mq.addEventListener?mq.addEventListener("change",onChange):mq.addListener(onChange);

  apply(root.getAttribute("data-theme")||"system");
})();
</script>

<script>
(function(){
  var img=document.querySelector("img.portrait");
  if(!img) return;

  /* Newest first, then back through the older ones, wrapping around. Entry 0 is the copy
     already embedded as base64, so it costs no request. The rest are ordinary files in
     /portraits/, fetched only if someone actually taps -- embedding all four would have
     added roughly 420KB of base64 to a page whose point is rendering instantly. */
  var shots=[
    {src:img.getAttribute("src"),      w:587,h:760,alt:"Portrait of Marco Ramo, smiling."},
    {src:"/portraits/blue-line-art.jpg",   w:587,h:760,alt:"Portrait of Marco Ramo."},
    {src:"/portraits/blue-duotone.jpg",    w:587,h:760,alt:"Portrait of Marco Ramo, blue duotone photograph."},
    {src:"/portraits/black-and-white.jpg", w:569,h:760,alt:"Portrait of Marco Ramo, black and white photograph."}
  ];
  var i=0, warmed=false;

  function warm(){
    if(warmed) return; warmed=true;
    for(var n=1;n<shots.length;n++){ var pre=new Image(); pre.src=shots[n].src; }
  }
  function show(n){
    i=(n+shots.length)%shots.length;
    var s=shots[i];
    img.setAttribute("width",s.w);      /* kept in step with the file so the box never jumps */
    img.setAttribute("height",s.h);
    img.alt=s.alt;
    img.src=s.src;
  }
  function step(e){ e.preventDefault(); warm(); show(i+1); }

  img.tabIndex=0;
  img.setAttribute("role","button");
  img.setAttribute("aria-label","Portrait of Marco Ramo. Activate to show a previous version.");
  img.title="Tap for a previous portrait";

  /* pointerdown fires before click on both mouse and touch, so the next file starts
     downloading a moment before it is needed. pointerenter covers unhurried desktop hovers. */
  img.addEventListener("pointerenter",warm,{once:true});
  img.addEventListener("pointerdown",warm,{once:true});
  img.addEventListener("click",step);
  img.addEventListener("keydown",function(e){
    if(e.key==="Enter"||e.key===" "||e.key==="Spacebar") step(e);
  });
  /* If a fetched version cannot load, fall back to the embedded one, which cannot fail. */
  img.addEventListener("error",function(){ if(i!==0) show(0); });
})();
</script>
